<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Define a codificação de caracteres -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Estilos visuais da página -->
    <style>
        /* Define a aparência geral da página */
        body {
            font-family: Arial, sans-serif;
            background-color: #cbcbcb;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        /* Estiliza o título principal */
        h1 {
            color: #333333;
        }

        /* Organiza os sites em cartões */
        .site {
            background-color: white;
            margin: 20px auto;
            padding: 20px;
            max-width: 400px;
            border-radius: 10px;
        }

        /* Define o tamanho das imagens */
        .site img {
            width: 200px;
            height: 120px;
            object-fit: contain;
        }

        /* Estiliza os links */
        a {
            color: #0645ad;
            text-decoration: none;
        }

        /* Destaca os links quando o mouse passa por cima */
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Título principal da página -->
    <h1>Meus sites favoritos: Guilherme Tisiani Acrani</h1>

    <!-- Primeiro site: YouTube -->
    <div class="site">
        <h1>YouTube</h1>
        <img src="youtube.png" alt="Logo do YouTube">
        <p>
            <a href="https://www.youtube.com/" target="_blank">
                Link
            </a>
        </p>
    </div>

    <!-- Segundo site: X (Twitter) -->
    <div class="site">
        <h1>X (Twitter)</h1>
        <img src="x.png" alt="Logo do X">
        <p>
            <a href="https://x.com/" target="_blank">
                Link
            </a>
        </p>
    </div>

    <!-- Terceiro site: Reddit -->
    <div class="site">
        <h1>Reddit</h1>
        <img src="reddit.png" alt="Logo do Reddit">
        <p>
            <a href="https://www.reddit.com/" target="_blank">
                Link
            </a>
        </p>
    </div>

    <!-- Quarto site: Twitch -->
    <div class="site">
        <h1>Twitch</h1>
        <img src="twitch.png" alt="Logo da Twitch">
        <p>
            <a href="https://www.twitch.tv/" target="_blank">
                Link
            </a>
        </p>
    </div>

    <!-- Quinto site: Netflix -->
    <div class="site">
        <h1>Netflix</h1>
        <img src="netflix.png" alt="Logo da Netflix">
        <p>
            <a href="https://www.netflix.com/" target="_blank">
                Link
            </a>
        </p>
    </div>
</body>
</html>
